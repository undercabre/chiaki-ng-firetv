name: Build Android (Fire TV)

on:
  push:
    branches: [ main, master, firetv ]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'cmake/**'
      - 'third-party/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-android-firetv.yml'
    tags: [ 'firetv-v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Optional secrets for a stable signature (updates without uninstalling). See android/FIRETV.md
      KEYSTORE_B64: ${{ secrets.CHIAKI_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: protoc and Python deps for nanopb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          protoc --version
          pip install protobuf grpcio-tools

      - name: Android NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Release keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CHIAKI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          CHIAKI_KEYSTORE_PASSWORD: ${{ secrets.CHIAKI_KEYSTORE_PASSWORD }}
          CHIAKI_KEY_ALIAS: ${{ secrets.CHIAKI_KEY_ALIAS }}
          CHIAKI_KEY_PASSWORD: ${{ secrets.CHIAKI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release*.apk "out/Chiaki-FireTV-${GITHUB_REF_NAME//\//-}.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: Chiaki-FireTV-apk
          path: out/*.apk

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/firetv-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
